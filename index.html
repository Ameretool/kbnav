<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Search Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { primary: '#6366f1' }
                }
            }
        }
    </script>
    <style>
        body {
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            transition: background 0.5s ease, background-image 0.5s ease;
            -webkit-tap-highlight-color: transparent;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.15); 
            z-index: -1;
            transition: background 0.5s;
        }
        html:not(.dark) body::before {
            background: rgba(255, 255, 255, 0.3);
        }

        .glass {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .dark .glass {
            background: rgba(20, 20, 25, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }
        ::-webkit-scrollbar { width: 0px; }
    </style>
</head>
<body class="min-h-screen text-gray-800 dark:text-gray-100 flex flex-col items-center pt-10 md:pt-20 pb-10 px-3 md:px-8">

    <!-- 顶部标题区 -->
    <div class="text-center mb-8 md:mb-12 flex flex-col items-center justify-center gap-1 md:gap-3 w-full max-w-4xl">
        <h1 class="text-3xl md:text-5xl font-bold tracking-wider drop-shadow-md">Search Hub</h1>
        <div class="flex items-center justify-center gap-4 text-xl md:text-3xl font-light opacity-90 mt-1 md:mt-2">
            <span id="clock">00:00</span>
        </div>
        <p class="text-xs md:text-sm opacity-70" id="date-text">Loading...</p>
    </div>

    <!-- 搜索框 -->
    <div class="w-full max-w-2xl glass rounded-full flex items-center shadow-2xl relative z-10 p-1.5 md:p-2">
        <div class="relative group shrink-0">
            <button id="engine-btn" class="flex items-center gap-1 px-3 py-1.5 md:px-4 md:py-2 hover:bg-black/10 dark:hover:bg-white/10 rounded-full transition cursor-pointer">
                <span id="current-engine-icon" class="text-lg">🌐</span>
                <svg class="w-3 h-3 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
            </button>
            <div id="engine-dropdown" class="absolute top-full left-0 mt-2 w-36 md:w-48 glass rounded-xl shadow-xl opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 z-20 overflow-hidden">
            </div>
        </div>

        <input type="text" id="search-input" 
            class="flex-1 min-w-0 bg-transparent border-none outline-none px-2 py-1 text-sm md:text-base placeholder-gray-500 dark:placeholder-gray-400"
            placeholder="Enter search content...">
        
        <button id="search-btn" class="shrink-0 p-2 md:p-2.5 mr-0.5 bg-primary text-white rounded-full hover:bg-indigo-600 transition shadow-lg flex items-center justify-center">
            <svg class="w-4 h-4 md:w-5 md:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        </button>
    </div>

    <!-- 快捷链接区域 -->
    <div class="w-full max-w-4xl mt-10 md:mt-16 z-10">
        <h2 class="text-sm md:text-base font-semibold mb-4 opacity-90 flex items-center gap-2" id="app-title">
            My Apps
        </h2>
        
        <div id="app-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 md:gap-4">
            <button id="add-app-btn" class="glass rounded-xl p-3 flex items-center justify-center gap-1 hover:bg-black/5 dark:hover:bg-white/5 transition border-dashed border border-gray-400 dark:border-gray-500 cursor-pointer min-h-[64px]">
                <span class="text-lg opacity-50">+</span>
                <span class="text-xs font-medium opacity-70" id="add-btn-text">Add New</span>
            </button>
        </div>
    </div>

    <!-- 右下角设置 -->
    <div class="fixed bottom-6 right-4 md:right-6 z-50">
        <button id="settings-btn" class="p-3 md:p-4 bg-primary text-white rounded-full shadow-2xl hover:scale-105 transition-transform">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
        </button>
        
        <!-- 设置面板 -->
        <div id="settings-panel" class="absolute bottom-14 right-0 w-64 md:w-72 glass rounded-2xl p-4 shadow-2xl hidden flex-col gap-4 border border-white/20">
            <div class="flex justify-between items-center">
                <span class="text-sm font-medium" id="set-lang">Language</span>
                <button id="toggle-lang" class="px-2 py-1 bg-black/10 dark:bg-white/10 rounded text-xs hover:bg-black/20 transition">EN / 中</button>
            </div>
            <div class="flex justify-between items-center">
                <span class="text-sm font-medium" id="set-theme">Dark Mode</span>
                <button id="toggle-theme" class="w-10 h-5 rounded-full bg-gray-300 dark:bg-primary relative transition-colors">
                    <div class="w-3 h-3 rounded-full bg-white absolute top-1 left-1 dark:left-6 transition-all shadow"></div>
                </button>
            </div>
            
            <!-- 背景设置区 -->
            <div class="flex flex-col gap-2 pt-3 border-t border-gray-400/30">
                <span class="text-sm font-medium" id="set-bg">Background</span>
                
                <!-- 预设渐变色块 -->
                <div class="flex justify-between gap-2 px-1 my-1" id="gradient-presets">
                    <button class="w-6 h-6 rounded-full shadow-md border border-white/30 hover:scale-110 transition" style="background: linear-gradient(135deg, #1e1e2f 0%, #4a1c40 100%);" onclick="setBgPreset('linear-gradient(135deg, #1e1e2f 0%, #4a1c40 100%)')" title="Deep Space"></button>
                    <button class="w-6 h-6 rounded-full shadow-md border border-white/30 hover:scale-110 transition" style="background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);" onclick="setBgPreset('linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%)')" title="Ocean"></button>
                    <button class="w-6 h-6 rounded-full shadow-md border border-white/30 hover:scale-110 transition" style="background: linear-gradient(135deg, #ff7e5f 0%, #feb47b 100%);" onclick="setBgPreset('linear-gradient(135deg, #ff7e5f 0%, #feb47b 100%)')" title="Sunset"></button>
                    <button class="w-6 h-6 rounded-full shadow-md border border-white/30 hover:scale-110 transition" style="background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);" onclick="setBgPreset('linear-gradient(135deg, #00c6ff 0%, #0072ff 100%)')" title="Sky"></button>
                    <button class="w-6 h-6 rounded-full shadow-md border border-white/30 hover:scale-110 transition" style="background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);" onclick="setBgPreset('linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%)')" title="Light"></button>
                    <button class="w-6 h-6 rounded-full shadow-md border border-white/30 hover:scale-110 transition" style="background: linear-gradient(135deg, #000000 0%, #434343 100%);" onclick="setBgPreset('linear-gradient(135deg, #000000 0%, #434343 100%)')" title="Black"></button>
                </div>

                <!-- 图片上传 -->
                <div class="flex gap-2 mt-1">
                    <label class="w-full text-center cursor-pointer bg-black/10 dark:bg-white/10 rounded-md py-1.5 text-xs hover:bg-black/20 transition">
                        <span id="bg-upload-text">Upload Custom Img</span>
                        <input type="file" id="bg-upload" class="hidden" accept="image/*">
                    </label>
                </div>
            </div>

            <!-- 🌟 新增：恢复默认按钮 -->
            <div class="pt-3 border-t border-gray-400/30 mt-1">
                <button id="reset-btn" class="w-full bg-red-500/10 hover:bg-red-500/20 text-red-500 rounded-lg py-2 text-xs font-medium transition border border-red-500/20" id="reset-text">
                    Reset All Data
                </button>
            </div>
        </div>
    </div>

    <!-- 添加链接模态框 -->
    <div id="modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden items-center justify-center px-4">
        <div class="glass p-5 rounded-xl w-full max-w-sm shadow-2xl">
            <h3 class="text-lg font-bold mb-4" id="modal-title">Add New App</h3>
            <input type="text" id="app-name" placeholder="Name" class="w-full bg-black/10 dark:bg-white/10 rounded px-3 py-2 mb-3 outline-none text-sm">
            <input type="url" id="app-url" placeholder="URL (https://...)" class="w-full bg-black/10 dark:bg-white/10 rounded px-3 py-2 mb-5 outline-none text-sm">
            <div class="flex justify-end gap-2">
                <button id="modal-cancel" class="px-3 py-1.5 rounded hover:bg-black/10 text-sm">Cancel</button>
                <button id="modal-save" class="px-3 py-1.5 bg-primary text-white rounded hover:bg-indigo-600 text-sm shadow">Save</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. 语言包 ---
        const i18n = {
            en: { placeholder: "Enter search content...", appTitle: "My Apps", addBtn: "Add New", setLang: "Language", setTheme: "Dark Mode", setBg: "Background", bgUpload: "Upload Custom Img", resetBtn: "Reset All Data", modalTitle: "Add New App", cancel: "Cancel", save: "Save", resetConfirm: "Are you sure you want to clear all data and restore defaults?" },
            zh: { placeholder: "输入搜索内容...", appTitle: "我的应用", addBtn: "添加新链接", setLang: "语言 / Language", setTheme: "深色模式", setBg: "背景设置", bgUpload: "上传自定义图片", resetBtn: "清空数据恢复默认", modalTitle: "添加新链接", cancel: "取消", save: "保存", resetConfirm: "确定要清空所有自定义数据并恢复默认设置吗？" }
        };
        let currentLang = localStorage.getItem('lang') || 'en';

        // --- 2. 搜索引擎 ---
        const engines = [
            { id: 'google', name: 'Google', url: 'https://www.google.com/search?q=', icon: '🌐' },
            { id: 'bing', name: 'Bing', url: 'https://www.bing.com/search?q=', icon: '🅱️' },
            { id: 'duckduckgo', name: 'DuckDuckGo', url: 'https://duckduckgo.com/?q=', icon: '🦆' },
            { id: 'yahoo', name: 'Yahoo', url: 'https://search.yahoo.com/search?p=', icon: '🟣' },
            { id: 'yandex', name: 'Yandex', url: 'https://yandex.com/search/?text=', icon: '🇷🇺' },
            { id: 'baidu', name: 'Baidu 百度', url: 'https://www.baidu.com/s?wd=', icon: '🐾' },
            { id: 'wiki', name: 'Wikipedia', url: 'https://en.wikipedia.org/wiki/Special:Search?search=', icon: '📖' }
        ];
        let currentEngine = engines[0];
        const $ = id => document.getElementById(id);

        // --- 3. 时间 ---
        function updateClock() {
            const now = new Date();
            $('clock').textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
            $('date-text').textContent = now.toLocaleDateString(currentLang === 'zh' ? 'zh-CN' : 'en-US', { weekday: 'short', month: 'short', day: 'numeric' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // --- 4. 语言渲染 ---
        function applyLang() {
            const d = i18n[currentLang];
            $('search-input').placeholder = d.placeholder;
            $('app-title').textContent = d.appTitle;
            $('add-btn-text').textContent = d.addBtn;
            $('set-lang').textContent = d.setLang;
            $('set-theme').textContent = d.setTheme;
            $('set-bg').textContent = d.setBg;
            $('bg-upload-text').textContent = d.bgUpload;
            $('reset-text').textContent = d.resetBtn;
            $('modal-title').textContent = d.modalTitle;
            $('modal-cancel').textContent = d.cancel;
            $('modal-save').textContent = d.save;
        }

        // --- 5. 搜索引擎下拉 ---
        function renderEngines() {
            const list = $('engine-dropdown');
            list.innerHTML = '';
            engines.forEach(eng => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left px-3 py-2 hover:bg-black/10 dark:hover:bg-white/10 flex items-center gap-2 text-xs md:text-sm";
                btn.innerHTML = `<span>${eng.icon}</span> ${eng.name}`;
                btn.onclick = () => {
                    currentEngine = eng;
                    $('current-engine-icon').textContent = eng.icon;
                    $('engine-dropdown').classList.add('opacity-0', 'invisible');
                };
                list.appendChild(btn);
            });
        }

        // --- 6. 搜索逻辑 ---
        function doSearch() {
            const kw = $('search-input').value.trim();
            if (!kw) return;
            window.open(currentEngine.url + encodeURIComponent(kw), '_blank');
        }
        $('search-btn').onclick = doSearch;
        $('search-input').addEventListener('keypress', e => { if(e.key === 'Enter') doSearch(); });

        // --- 7. 快捷链接图标逻辑 ---
        function getDomain(url) {
            try { return new URL(url).hostname; } catch (e) { return ''; }
        }

        function getFaviconHTML(app) {
            const domain = getDomain(app.url);
            const iconUrl = `https://api.iowen.cn/favicon/${domain}.png`;
            const firstLetter = app.name.charAt(0).toUpperCase();
            return `
                <div class="w-8 h-8 rounded-lg bg-white/30 dark:bg-black/30 flex-shrink-0 flex items-center justify-center overflow-hidden shadow-sm">
                    <img src="${iconUrl}" class="w-full h-full object-contain hidden" 
                         onload="this.classList.remove('hidden'); this.nextElementSibling.classList.add('hidden');"
                         onerror="this.classList.add('hidden'); this.nextElementSibling.classList.remove('hidden');">
                    <span class="text-xs font-bold opacity-70 hidden">${firstLetter}</span>
                </div>
            `;
        }

        // --- 8. 应用列表管理 ---
        const defaultApps = [
            { name: 'GitHub', url: 'https://github.com' },
            { name: 'YouTube', url: 'https://youtube.com' },
            { name: 'Bilibili', url: 'https://bilibili.com' },
            { name: 'ChatGPT', url: 'https://chatgpt.com' }
        ];
        let apps = JSON.parse(localStorage.getItem('myApps')) || defaultApps;

        function renderApps() {
            const grid = $('app-grid');
            const addBtn = $('add-app-btn');
            grid.innerHTML = '';
            
            apps.forEach((app, index) => {
                const card = document.createElement('div');
                card.className = "glass rounded-xl p-2.5 flex items-center gap-2 hover:-translate-y-0.5 hover:shadow-xl transition-all cursor-pointer group relative min-h-[60px] overflow-hidden";
                card.onclick = () => window.open(app.url, '_blank');
                
                card.innerHTML = `
                    ${getFaviconHTML(app)}
                    <span class="font-medium text-xs truncate flex-1">${app.name}</span>
                    <button class="absolute top-1 right-1 opacity-0 group-hover:opacity-100 p-0.5 bg-red-500 text-white rounded text-[10px] delete-btn" data-index="${index}">✕</button>
                `;
                grid.appendChild(card);
            });
            grid.appendChild(addBtn);

            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.onclick = (e) => {
                    e.stopPropagation();
                    apps.splice(parseInt(btn.getAttribute('data-index')), 1);
                    saveApps();
                }
            });
        }

        function saveApps() {
            localStorage.setItem('myApps', JSON.stringify(apps));
            renderApps();
        }

        // --- 9. 模态框 ---
        $('add-app-btn').onclick = () => $('modal').classList.replace('hidden', 'flex');
        $('modal-cancel').onclick = () => {
            $('modal').classList.replace('flex', 'hidden');
            $('app-name').value = ''; $('app-url').value = '';
        };
        $('modal-save').onclick = () => {
            const name = $('app-name').value.trim();
            let url = $('app-url').value.trim();
            if (!name || !url) return;
            if (!url.startsWith('http')) url = 'https://' + url;
            apps.push({ name, url });
            saveApps();
            $('modal-cancel').click();
        };

        // --- 10. 设置项 ---
        $('settings-btn').onclick = () => $('settings-panel').classList.toggle('hidden');
        $('toggle-theme').onclick = () => {
            document.documentElement.classList.toggle('dark');
            localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
        };
        if (localStorage.theme === 'light') document.documentElement.classList.remove('dark');

        $('toggle-lang').onclick = () => {
            currentLang = currentLang === 'en' ? 'zh' : 'en';
            localStorage.setItem('lang', currentLang);
            applyLang();
        };

        function setBgPreset(gradient) {
            localStorage.setItem('bgColor', gradient);
            localStorage.removeItem('bgImg');
            applyBackground();
        }

        $('bg-upload').addEventListener('change', e => {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = ev => {
                localStorage.setItem('bgImg', ev.target.result);
                applyBackground();
            };
            reader.readAsDataURL(file);
        });

        function applyBackground() {
            const img = localStorage.getItem('bgImg');
            const color = localStorage.getItem('bgColor');
            
            if (img) {
                document.body.style.backgroundImage = `url('${img}')`;
                document.body.style.background = `url('${img}') center/cover fixed`; 
            } else {
                const defaultGradient = 'linear-gradient(135deg, #1e1e2f 0%, #4a1c40 100%)';
                document.body.style.background = color || defaultGradient;
            }
        }

        // 🌟 新增：恢复默认逻辑
        $('reset-btn').onclick = () => {
            if(confirm(i18n[currentLang].resetConfirm)) {
                localStorage.clear(); // 清空所有本地存储
                location.reload();    // 刷新页面重新加载
            }
        };

        // 初始化
        applyLang();
        renderEngines();
        renderApps();
        applyBackground();
        $('current-engine-icon').textContent = currentEngine.icon;
    </script>
</body>
</html>
