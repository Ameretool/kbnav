<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Search Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { primary: '#6366f1' }
                }
            }
        }
    </script>
    <style>
        body {
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            transition: background 0.5s ease;
            -webkit-tap-highlight-color: transparent; /* 移除手机点击高亮 */
        }
        .glass {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .dark .glass {
            background: rgba(20, 20, 25, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }
        ::-webkit-scrollbar { width: 0px; }
    </style>
</head>
<body class="min-h-screen text-gray-800 dark:text-gray-100 flex flex-col items-center pt-12 md:pt-20 pb-10 px-4 md:px-8">

    <!-- 顶部：时间与标题 (手机自动换行居中) -->
    <div class="text-center mb-8 md:mb-12 flex flex-col md:flex-row items-center justify-center gap-2 md:gap-6 w-full max-w-4xl">
        <h1 class="text-3xl md:text-5xl font-bold tracking-wider drop-shadow-lg flex items-center gap-3">
            Search Hub
        </h1>
        <div class="flex items-center gap-3 text-xl md:text-3xl font-light opacity-80 md:border-l-2 md:border-gray-400/50 md:pl-6">
            <span id="clock">00:00</span>
        </div>
        <p class="text-xs md:text-sm opacity-70 w-full md:w-auto mt-1 md:mt-0" id="date-text">Loading...</p>
    </div>

    <!-- 搜索区域 -->
    <div class="w-full max-w-3xl glass rounded-full flex items-center shadow-2xl relative z-10 p-1 md:p-2">
        <!-- 搜索引擎下拉切换 -->
        <div class="relative group shrink-0">
            <button id="engine-btn" class="flex items-center gap-1 md:gap-2 px-2 md:px-4 py-2 md:py-3 hover:bg-black/10 dark:hover:bg-white/10 rounded-full transition cursor-pointer">
                <span id="current-engine-icon" class="text-lg md:text-xl">🌐</span>
                <svg class="w-3 h-3 md:w-4 md:h-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
            </button>
            <!-- 引擎列表 -->
            <div id="engine-dropdown" class="absolute top-full left-0 mt-2 w-40 md:w-48 glass rounded-xl shadow-xl opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 z-20 overflow-hidden">
                <!-- 动态渲染 -->
            </div>
        </div>

        <input type="text" id="search-input" 
            class="flex-1 min-w-0 bg-transparent border-none outline-none px-2 md:px-4 py-2 md:py-3 text-sm md:text-lg placeholder-gray-500 dark:placeholder-gray-400"
            placeholder="Enter search content...">
        
        <button id="search-btn" class="shrink-0 p-2 md:p-3 mr-1 bg-primary text-white rounded-full hover:bg-indigo-600 transition shadow-lg flex items-center justify-center">
            <svg class="w-4 h-4 md:w-6 md:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        </button>
    </div>

    <!-- APP / 快捷链接区域 -->
    <div class="w-full max-w-5xl mt-12 md:mt-16 px-1">
        <h2 class="text-base md:text-lg font-semibold mb-4 md:mb-6 flex items-center gap-2 opacity-90" id="app-title">
            <svg class="w-4 h-4 md:w-5 md:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
            My Apps
        </h2>
        
        <div id="app-grid" class="grid grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3 md:gap-4">
            <!-- 快捷卡片动态渲染到这里 -->
            
            <!-- 添加按钮卡片 -->
            <button id="add-app-btn" class="glass rounded-xl md:rounded-2xl p-3 md:p-4 flex items-center justify-center gap-2 hover:bg-black/5 dark:hover:bg-white/5 transition border-dashed border-2 border-gray-400 dark:border-gray-600 cursor-pointer min-h-[64px] md:min-h-[80px]">
                <span class="text-xl md:text-2xl opacity-50">+</span>
                <span class="text-sm md:text-base font-medium opacity-70 truncate" id="add-btn-text">Add New</span>
            </button>
        </div>
    </div>

    <!-- 设置悬浮窗 (右下角) -->
    <div class="fixed bottom-6 right-4 md:right-6 z-50">
        <button id="settings-btn" class="p-3 md:p-4 bg-primary text-white rounded-full shadow-2xl hover:scale-105 transition-transform">
            <svg class="w-5 h-5 md:w-6 md:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
        </button>
        
        <!-- 设置面板 -->
        <div id="settings-panel" class="absolute bottom-16 right-0 w-64 md:w-72 glass rounded-2xl p-4 md:p-5 shadow-2xl hidden flex-col gap-4 border border-white/20">
            <!-- 语言切换 -->
            <div class="flex justify-between items-center">
                <span class="text-sm font-medium" id="set-lang">Language</span>
                <button id="toggle-lang" class="px-3 py-1 bg-black/10 dark:bg-white/10 rounded-lg text-sm hover:bg-black/20 dark:hover:bg-white/20 transition">EN / 中</button>
            </div>
            <!-- 主题切换 -->
            <div class="flex justify-between items-center">
                <span class="text-sm font-medium" id="set-theme">Dark Mode</span>
                <button id="toggle-theme" class="w-10 h-5 md:w-12 md:h-6 rounded-full bg-gray-300 dark:bg-primary relative transition-colors">
                    <div class="w-3 h-3 md:w-4 md:h-4 rounded-full bg-white absolute top-1 left-1 dark:left-6 md:dark:left-7 transition-all shadow"></div>
                </button>
            </div>
            <!-- 背景设置 -->
            <div class="flex flex-col gap-2 mt-2 pt-4 border-t border-gray-400/30">
                <span class="text-sm font-medium" id="set-bg">Background</span>
                <div class="flex gap-2">
                    <label class="flex-1 text-center cursor-pointer bg-black/10 dark:bg-white/10 rounded-lg py-2 text-xs hover:bg-black/20 transition truncate">
                        <span id="bg-upload-text">Upload Img</span>
                        <input type="file" id="bg-upload" class="hidden" accept="image/*">
                    </label>
                    <input type="color" id="bg-color" class="w-10 h-8 rounded cursor-pointer bg-transparent border-none p-0" value="#1a1a2e" title="纯色背景">
                </div>
            </div>
        </div>
    </div>

    <!-- 添加链接模态框 -->
    <div id="modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden items-center justify-center px-4">
        <div class="glass p-5 md:p-6 rounded-2xl w-full max-w-sm shadow-2xl">
            <h3 class="text-lg md:text-xl font-bold mb-4" id="modal-title">Add New App</h3>
            <input type="text" id="app-name" placeholder="Name (e.g. GitHub)" class="w-full bg-black/10 dark:bg-white/10 rounded-lg px-4 py-2 mb-3 outline-none">
            <input type="url" id="app-url" placeholder="URL (e.g. https://github.com)" class="w-full bg-black/10 dark:bg-white/10 rounded-lg px-4 py-2 mb-6 outline-none">
            <div class="flex justify-end gap-3">
                <button id="modal-cancel" class="px-4 py-2 rounded-lg hover:bg-black/10 transition text-sm md:text-base" id="modal-cancel-btn">Cancel</button>
                <button id="modal-save" class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-indigo-600 transition shadow-lg text-sm md:text-base" id="modal-save-btn">Save</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. 多语言字典 ---
        const i18n = {
            en: {
                placeholder: "Enter search content...",
                appTitle: "My Apps",
                addBtn: "Add New",
                setLang: "Language",
                setTheme: "Dark Mode",
                setBg: "Background",
                bgUpload: "Upload Img",
                modalTitle: "Add New App",
                modalName: "Name (e.g. GitHub)",
                modalUrl: "URL (e.g. https://github.com)",
                cancel: "Cancel",
                save: "Save"
            },
            zh: {
                placeholder: "输入搜索内容...",
                appTitle: "我的应用",
                addBtn: "添加新链接",
                setLang: "语言 / Language",
                setTheme: "深色模式",
                setBg: "背景设置",
                bgUpload: "上传图片",
                modalTitle: "添加新链接",
                modalName: "名称 (例如：GitHub)",
                modalUrl: "网址 (例如：https://github.com)",
                cancel: "取消",
                save: "保存"
            }
        };
        let currentLang = localStorage.getItem('lang') || 'en';

        // --- 2. 搜索引擎配置 (支持国际主流) ---
        const engines = [
            { id: 'google', name: 'Google', url: 'https://www.google.com/search?q=', icon: '🌐' },
            { id: 'bing', name: 'Bing', url: 'https://www.bing.com/search?q=', icon: '🅱️' },
            { id: 'duckduckgo', name: 'DuckDuckGo', url: 'https://duckduckgo.com/?q=', icon: '🦆' },
            { id: 'yahoo', name: 'Yahoo', url: 'https://search.yahoo.com/search?p=', icon: '🟣' },
            { id: 'yandex', name: 'Yandex', url: 'https://yandex.com/search/?text=', icon: '🇷🇺' },
            { id: 'baidu', name: 'Baidu 百度', url: 'https://www.baidu.com/s?wd=', icon: '🐾' },
            { id: 'wiki', name: 'Wikipedia', url: 'https://en.wikipedia.org/wiki/Special:Search?search=', icon: '📖' }
        ];
        let currentEngine = engines[0];

        // --- 3. 初始化 UI 逻辑 ---
        const $ = id => document.getElementById(id);

        // 时钟
        function updateClock() {
            const now = new Date();
            $('clock').textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
            $('date-text').textContent = now.toLocaleDateString(currentLang === 'zh' ? 'zh-CN' : 'en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 渲染语言
        function applyLang() {
            const dict = i18n[currentLang];
            $('search-input').placeholder = dict.placeholder;
            $('app-title').innerHTML = `<svg class="w-4 h-4 md:w-5 md:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg> ${dict.appTitle}`;
            $('add-btn-text').textContent = dict.addBtn;
            $('set-lang').textContent = dict.setLang;
            $('set-theme').textContent = dict.setTheme;
            $('set-bg').textContent = dict.setBg;
            $('bg-upload-text').textContent = dict.bgUpload;
            $('modal-title').textContent = dict.modalTitle;
            $('app-name').placeholder = dict.modalName;
            $('app-url').placeholder = dict.modalUrl;
            $('modal-cancel').textContent = dict.cancel;
            $('modal-save').textContent = dict.save;
            updateClock();
        }

        // 渲染搜索引擎下拉
        function renderEngines() {
            const list = $('engine-dropdown');
            list.innerHTML = '';
            engines.forEach(eng => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left px-3 md:px-4 py-2 md:py-3 hover:bg-black/10 dark:hover:bg-white/10 transition flex items-center gap-2 md:gap-3 text-xs md:text-sm";
                btn.innerHTML = `<span class="text-base md:text-lg">${eng.icon}</span> ${eng.name}`;
                btn.onclick = () => {
                    currentEngine = eng;
                    $('current-engine-icon').textContent = eng.icon;
                    $('engine-dropdown').classList.add('opacity-0', 'invisible');
                };
                list.appendChild(btn);
            });
        }

        // 执行搜索
        function doSearch() {
            const kw = $('search-input').value.trim();
            if (!kw) return;
            window.open(currentEngine.url + encodeURIComponent(kw), '_blank');
        }
        $('search-btn').onclick = doSearch;
        $('search-input').addEventListener('keypress', e => { if(e.key === 'Enter') doSearch(); });

        // --- 4. APP 快捷链接管理 ---
        // 获取网站 favicon (替换了更稳定的源，失败则显示首字母)
        function getDomain(url) {
            try { return new URL(url).hostname; } catch (e) { return ''; }
        }

        function getFaviconHTML(app) {
            const domain = getDomain(app.url);
            // 使用 DuckDuckGo 获取图标
            const iconUrl = `https://icons.duckduckgo.com/ip3/${domain}.ico`;
            const firstLetter = app.name.charAt(0).toUpperCase();
            
            // 如果图片加载失败，利用 onerror 替换为带有首字母的 div
            return `
                <div class="w-8 h-8 md:w-10 md:h-10 rounded-lg bg-white/20 flex-shrink-0 flex items-center justify-center overflow-hidden">
                    <img src="${iconUrl}" class="w-full h-full object-contain hidden" 
                         onload="this.classList.remove('hidden'); this.nextElementSibling.classList.add('hidden');"
                         onerror="this.classList.add('hidden'); this.nextElementSibling.classList.remove('hidden');">
                    <span class="text-sm md:text-lg font-bold opacity-80 hidden">${firstLetter}</span>
                </div>
            `;
        }

        // 默认自带几个快捷链接
        const defaultApps = [
            { name: 'GitHub', url: 'https://github.com' },
            { name: 'YouTube', url: 'https://youtube.com' },
            { name: 'Bilibili', url: 'https://bilibili.com' },
            { name: 'ChatGPT', url: 'https://chatgpt.com' }
        ];

        let apps = JSON.parse(localStorage.getItem('myApps')) || defaultApps;

        function renderApps() {
            const grid = $('app-grid');
            const addBtn = $('add-app-btn');
            grid.innerHTML = '';
            
            apps.forEach((app, index) => {
                const card = document.createElement('div');
                card.className = "glass rounded-xl md:rounded-2xl p-3 md:p-4 flex items-center gap-2 md:gap-3 hover:-translate-y-1 hover:shadow-xl transition-all cursor-pointer group relative min-h-[64px] md:min-h-[80px] overflow-hidden";
                card.onclick = () => window.open(app.url, '_blank');
                
                card.innerHTML = `
                    ${getFaviconHTML(app)}
                    <span class="font-medium text-xs md:text-sm truncate pr-4 flex-1">${app.name}</span>
                    <!-- 删除按钮 -->
                    <button class="absolute top-1 right-1 md:top-2 md:right-2 opacity-0 group-hover:opacity-100 p-0.5 md:p-1 bg-red-500/80 text-white rounded-md text-[10px] md:text-xs transition hover:bg-red-600 delete-btn" data-index="${index}">✕</button>
                `;
                grid.appendChild(card);
            });

            grid.appendChild(addBtn);

            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.onclick = (e) => {
                    e.stopPropagation();
                    const idx = parseInt(btn.getAttribute('data-index'));
                    apps.splice(idx, 1);
                    saveApps();
                }
            });
        }

        function saveApps() {
            localStorage.setItem('myApps', JSON.stringify(apps));
            renderApps();
        }

        // 模态框逻辑
        $('add-app-btn').onclick = () => $('modal').classList.replace('hidden', 'flex');
        $('modal-cancel').onclick = () => {
            $('modal').classList.replace('flex', 'hidden');
            $('app-name').value = ''; $('app-url').value = '';
        };
        $('modal-save').onclick = () => {
            const name = $('app-name').value.trim();
            let url = $('app-url').value.trim();
            if (!name || !url) return alert('Please fill both fields.');
            if (!url.startsWith('http')) url = 'https://' + url;
            apps.push({ name, url });
            saveApps();
            $('modal-cancel').click();
        };


        // --- 5. 设置面板 (主题/语言/背景) ---
        $('settings-btn').onclick = () => $('settings-panel').classList.toggle('hidden');

        // 主题切换
        $('toggle-theme').onclick = () => {
            document.documentElement.classList.toggle('dark');
            localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
        };
        if (localStorage.theme === 'light') document.documentElement.classList.remove('dark');

        // 语言切换
        $('toggle-lang').onclick = () => {
            currentLang = currentLang === 'en' ? 'zh' : 'en';
            localStorage.setItem('lang', currentLang);
            applyLang();
        };

        // 背景上传 & 纯色
        $('bg-upload').addEventListener('change', e => {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = ev => {
                localStorage.setItem('bgImg', ev.target.result);
                applyBackground();
            };
            reader.readAsDataURL(file);
        });

        $('bg-color').addEventListener('input', e => {
            localStorage.setItem('bgColor', e.target.value);
            localStorage.removeItem('bgImg');
            applyBackground();
        });

        function applyBackground() {
            const savedImg = localStorage.getItem('bgImg');
            const savedColor = localStorage.getItem('bgColor');
            if (savedImg) {
                document.body.style.backgroundImage = `url('${savedImg}')`;
                document.body.style.backgroundColor = ''; 
            } else {
                document.body.style.backgroundImage = 'none';
                document.body.style.background = savedColor || 'linear-gradient(135deg, #1e1e2f 0%, #4a1c40 100%)';
            }
        }

        // 初始化
        applyLang();
        renderEngines();
        renderApps();
        applyBackground();
        $('current-engine-icon').textContent = currentEngine.icon;

    </script>
</body>
</html>
